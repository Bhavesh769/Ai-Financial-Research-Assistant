services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: financial-rag-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: financial-rag-api

    ports:
      - "8001:8001"

    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434

    depends_on:
      - qdrant

    volumes:
      - ./data:/app/data

    restart: unless-stopped


volumes:
  qdrant_storage: